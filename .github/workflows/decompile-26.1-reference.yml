name: Decompile upstream Minecraft 26.1 reference

on:
  pull_request:
    paths:
      - ".github/workflows/decompile-26.1-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile-reference:
    name: Extract upstream 26.1 reference sources
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download and verify upstream 26.1 JAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/CapitalistEnemy1/Spotify-Craft-MC-Mod/releases/download/4.0.0/spotify_craft_26.1.jar" \
            --output /tmp/spotify_craft_26.1.jar
          echo "13e95d2690aa0de9e5082a4feb773622a49b640639e6732e9665232d136dfca8  /tmp/spotify_craft_26.1.jar" \
            | sha256sum --check
          mkdir -p reference/resources reference/classes
          unzip -q /tmp/spotify_craft_26.1.jar -d reference/resources
          echo "Upstream JAR entries: $(jar tf /tmp/spotify_craft_26.1.jar | wc -l)"
          echo "Mod metadata:"
          cat reference/resources/fabric.mod.json

      - name: Decompile Minecraft 26.1 mod classes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar" \
            --output /tmp/cfr.jar
          java -jar /tmp/cfr.jar /tmp/spotify_craft_26.1.jar \
            --outputdir reference/sources \
            --comments false \
            --silent true
          test -d reference/sources
          find reference/sources -type f -name '*.java' | sort > reference/java-files.txt
          echo "Decompiled Java files: $(wc -l < reference/java-files.txt)"
          sed -n '1,80p' reference/java-files.txt

      - name: Package temporary reference
        run: |
          zip -qr /tmp/spotifycraft-26.1-reference.zip reference

      - name: Upload decompiled reference for the port
        uses: actions/upload-artifact@v4
        with:
          name: spotifycraft-26.1-reference-sources
          path: /tmp/spotifycraft-26.1-reference.zip
          if-no-files-found: error
          retention-days: 7
