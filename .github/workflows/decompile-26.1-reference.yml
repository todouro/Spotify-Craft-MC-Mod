name: Extract upstream Minecraft 26.1 source

on:
  pull_request:
    paths:
      - ".github/workflows/decompile-26.1-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile-reference:
    name: Extract upstream 26.1 source
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download and verify upstream 26.1 JAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/CapitalistEnemy1/Spotify-Craft-MC-Mod/releases/download/4.0.0/spotify_craft_26.1.jar" \
            --output /tmp/spotify_craft_26.1.jar
          echo "13e95d2690aa0de9e5082a4feb773622a49b640639e6732e9665232d136dfca8  /tmp/spotify_craft_26.1.jar" \
            | sha256sum --check
          mkdir -p reference/resources
          unzip -q /tmp/spotify_craft_26.1.jar -d reference/resources
          echo "Upstream JAR entries: $(jar tf /tmp/spotify_craft_26.1.jar | wc -l)"
          echo "Build metadata:"
          grep -E '^Fabric-(Gradle|Loom|Minecraft|Loader)-Version:' \
            reference/resources/META-INF/MANIFEST.MF

      - name: Decompile Minecraft 26.1 mod classes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar" \
            --output /tmp/cfr.jar
          java -jar /tmp/cfr.jar /tmp/spotify_craft_26.1.jar \
            --outputdir reference/sources \
            --comments false \
            --silent true
          test -d reference/sources
          echo "Decompiled Java files: $(find reference/sources -type f -name '*.java' | wc -l)"

      - name: Add 26.1 source and resources to the PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p versions/26.1/src/main/java versions/26.1/src/main/resources
          cp -a reference/sources/. versions/26.1/src/main/java/
          cp -a reference/resources/. versions/26.1/src/main/resources/
          find versions/26.1/src/main/resources -type f -name '*.class' -delete
          rm -f versions/26.1/src/main/resources/META-INF/MANIFEST.MF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/26.1/src/main/java versions/26.1/src/main/resources
          if git diff --cached --quiet; then
            echo "26.1 source already extracted."
            exit 0
          fi
          git commit -m "chore: add decompiled Minecraft 26.1 source baseline"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Package temporary reference
        if: always()
        run: |
          if [ -d reference ]; then
            zip -qr /tmp/spotifycraft-26.1-reference.zip reference
          fi

      - name: Upload decompiled reference for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotifycraft-26.1-reference-sources
          path: /tmp/spotifycraft-26.1-reference.zip
          if-no-files-found: ignore
          retention-days: 7
