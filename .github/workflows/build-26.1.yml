name: Build Minecraft 26.1

on:
  pull_request:
    branches: [main, master]
    paths:
      - "versions/26.1/**"
      - ".github/workflows/build-26.1.yml"
  push:
    branches:
      - "port/minecraft-26.1"
    paths:
      - "versions/26.1/**"
      - ".github/workflows/build-26.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and verify 26.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build Minecraft 26.1
        run: gradle -p versions/26.1 clean build --no-daemon --stacktrace

      - name: Verify mod JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find versions/26.1/build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              | sort
          )
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one Minecraft 26.1 JAR, found ${#jars[@]}."
            find versions/26.1/build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          jar_file="${jars[0]}"
          jar tf "$jar_file" | grep -Fxq 'fabric.mod.json'
          jar tf "$jar_file" | grep -Fxq 'neonlyrics.mixins.json'
          jar tf "$jar_file" | grep -Fxq 'dev/neonlyrics/NeonLyrics.class'
          echo "Verified Minecraft 26.1 JAR: $jar_file"

      - name: Upload 26.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: spotifycraft-26.1
          path: |
            versions/26.1/build/libs/*.jar
            !versions/26.1/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
