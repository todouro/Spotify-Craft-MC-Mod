name: Build and publish SpotifyCraft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-1-21-11:
    name: Build Minecraft 1.21.11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Prepare intermediary source mappings
        run: python3 scripts/prepare_intermediary_mappings.py

      - name: Build mod
        run: gradle clean build --no-daemon

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-sources.jar' \
              | sort
          )
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one 1.21.11 JAR, found ${#jars[@]}."
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          jar tf "${jars[0]}" | grep -Fxq 'fabric.mod.json'
          jar tf "${jars[0]}" | grep -Fxq 'dev/neonlyrics/NeonLyrics.class'

      - name: Upload 1.21.11 JAR
        uses: actions/upload-artifact@v4
        with:
          name: spotifycraft-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 7

  build-26-1:
    name: Build Minecraft 26.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Minecraft 26.1 mod
        run: gradle -p versions/26.1 clean build --no-daemon

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find versions/26.1/build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              | sort
          )
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one 26.1 JAR, found ${#jars[@]}."
            find versions/26.1/build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          jar tf "${jars[0]}" | grep -Fxq 'fabric.mod.json'
          jar tf "${jars[0]}" | grep -Fxq 'dev/neonlyrics/NeonLyrics.class'

      - name: Upload Minecraft 26.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: spotifycraft-26.1
          path: |
            versions/26.1/build/libs/*.jar
            !versions/26.1/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-1-21-11, build-26-1]
    permissions:
      contents: write

    steps:
      - name: Download 1.21.11 JAR
        uses: actions/download-artifact@v4
        with:
          name: spotifycraft-1.21.11
          path: artifacts/1.21.11/

      - name: Download 26.1 JAR
        uses: actions/download-artifact@v4
        with:
          name: spotifycraft-26.1
          path: artifacts/26.1/

      - name: Publish release with both JARs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/1.21.11/*.jar
            artifacts/26.1/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
